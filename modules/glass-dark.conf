# vim:ft=kitty
## name: Glass Dark

# Core terminal colors
# RGB 90,94,100 -> #5a5e64 (or RGB 29,31,34 -> #1d1f22 for deep base)
background              #1d1f22
foreground              #c3c7d1
selection_background    #3dbee9
selection_foreground    #fcfcfc

# Cursor
cursor                  #3daee9
cursor_text_color       #1d1f22

# URLs & Links (ForegroundLink: 29,153,243)
url_color               #1d99f3

# Borders
active_border_color     #3daee9
inactive_border_color   #34383c
bell_border_color       #f67400

# Tab Bar
active_tab_background   #5a5e64
active_tab_foreground   #fcfcfc
inactive_tab_background #1d1f22
inactive_tab_foreground #a1a9b1
tab_bar_background      #1d1f22

# Marks
mark1_foreground        #1d1f22
mark1_background        #3daee9
mark2_foreground        #1d1f22
mark2_background        #fdbc4b
mark3_foreground        #1d1f22
mark3_background        #da4453

# --- ANSI Colors ---

#: Black (Window / background shadows)
color0                  #1d1f22
color8                  #5a5e64

#: Red (ForegroundNegative: 218,68,83)
color1                  #da4453
color9                  #ed1515

#: Green (ForegroundPositive: 39,174,96)
color2                  #27ae60
color10                 #11d116

#: Yellow (ForegroundNeutral / Link alt: 246,116,0 / 253,188,75)
color3                  #f67400
color11                 #fdbc4b

#: Blue (ForegroundActive / Focus: 61,174,233)
color4                  #1d99f3
color12                 #3daee9

#: Magenta (ForegroundVisited: 155,89,182)
color5                  #9b59b6
color13                 #995dc6

#: Cyan (DecorationFocus / Accent: 0,170,255)
color6                  #00aaff
color14                 #3dc9e9

#: White (ForegroundNormal / Text: 195,199,209 & 252,252,252)
color7                  #c3c7d1
color15                 #fcfcfc
